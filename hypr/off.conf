# Apothecary Hyprland — theme OFF.
# ~/.config/apothecary/active.conf points here while the theme is disabled, so the only things the Apothecary layer
# contributes are the always-on exec-once in hypr/apothecary.conf and the one bind below.

# Projects on the stock desktop (no widget layer there): SUPER+SHIFT+P opens the rofi menu of `hypr-projects` (Enter toggles a project,
# "+ Add project…" asks for a title, "✕ Remove…" deletes, Esc closes). `--if-stock` makes it do nothing while Apothecary or Overworld
# is on (each theme binds the same key to its own dialog), and the menu takes a lock, so Overworld's identical line in its off.conf
# (both files load when both themes are off) never opens two windows. Free on JaKooLit (checked against `hyprctl binds`).
bindd = SUPER SHIFT, P, Projects (stock desktop: rofi menu), exec, ~/.local/bin/hypr-projects menu --if-stock
