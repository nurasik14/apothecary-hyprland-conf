# Apothecary Hyprland — hyprlock (hyprlock ≥ 0.9). Linked to ~/.config/hypr/hyprlock.conf ONLY while the theme is
# on (`apothecary on` moves the original to hyprlock.conf.pre-apothecary; `apothecary off` restores it).
# Composition per docs/DESIGN.md §7.5: the Maomao art is the point (no blur); text column on the left 640 px,
# clock big in Cormorant Garamond, the 時辰 period glyph in the seal colour, date, a quote, a paper password field.
# Colours/fonts: ~/.config/apothecary/hyprlock-vars.conf -> tokens/out/<mode>/hyprlock-vars.conf ($apo_*).
# NOT live-tested (hyprlock cannot be dry-run without locking the session) — see docs/INSTALL.md → Troubleshooting.

source = ~/.config/apothecary/hyprlock-vars.conf
$scripts = $HOME/.config/apothecary/repo/hypr/scripts
$lockart = $HOME/.config/apothecary/lock.png

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 0
}

auth {
    pam:enabled = true
}

animations {
    enabled = true
    bezier = ink, 0.22, 1, 0.36, 1
    bezier = brush, 0.65, 0, 0.35, 1
    animation = fadeIn, 1, 5, ink
    animation = fadeOut, 1, 4, brush
    animation = inputFieldColors, 1, 3, brush
    animation = inputFieldFade, 1, 3, brush
    animation = inputFieldWidth, 1, 3, ink
    animation = inputFieldDots, 1, 2, ink
}

# ---- background: the lock art for the current mode (the CLI keeps lock.png -> assets/art/lock-<mode>.png,
#      or -> the current wallpaper when the art is missing). No blur, no vibrancy — the illustration stays crisp.
background {
    monitor =
    path = $lockart
    color = $apo_bg0
    blur_passes = 0
    blur_size = 0
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
}

# ---- avatar (optional): assets/art/portrait-maomao.png, round, seal-coloured ring
image {
    monitor =
    path = $HOME/.config/apothecary/repo/assets/art/portrait-maomao.png
    size = 64
    rounding = -1
    border_size = 2
    border_color = $apo_seal
    reload_time = -1
    position = 120, -220
    halign = left
    valign = top
}

# ---- clock 11:42 — Cormorant Garamond 128
label {
    monitor =
    text = <span weight="300">$TIME</span>
    color = $apo_text
    font_size = 128
    font_family = $apo_font_clock
    position = 120, -290
    halign = left
    valign = top
}

# ---- 時辰 glyph (午) in the seal colour, with its Latin meaning underneath
label {
    monitor =
    text = cmd[update:60000] $scripts/shichen.sh
    color = $apo_seal
    font_size = 96
    font_family = $apo_font_shichen
    position = 560, -300
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] $scripts/shichen.sh --label
    color = $apo_textMuted
    font_size = 14
    font_family = $apo_font_quote
    position = 560, -440
    halign = left
    valign = top
}

# ---- date: Thursday 29 October · 十月廿九
label {
    monitor =
    text = cmd[update:60000] echo "<i>$(date +'%A %-d %B')</i>  ·  $($scripts/shichen.sh --date)"
    color = $apo_text
    font_size = 20
    font_family = $apo_font_quote
    position = 120, -470
    halign = left
    valign = top
}

# ---- quote (rotates every 10 min)
label {
    monitor =
    text = cmd[update:600000] $scripts/quote.sh 58
    text_align = left
    color = $apo_textMuted
    font_size = 20
    font_family = $apo_font_quote
    position = 120, -560
    halign = left
    valign = top
}

# ---- the seal 印 beside the password field (the field itself cannot hold an icon)
shape {
    monitor =
    size = 32, 32
    color = $apo_seal
    rounding = 3
    border_size = 0
    position = 120, -708
    halign = left
    valign = top
}
label {
    monitor =
    text = 印
    color = $apo_textOnSeal
    font_size = 18
    font_family = $apo_font_shichen
    position = 126, -711
    halign = left
    valign = top
}

# ---- password field 320×48, paper: surface fill, 2 px ink frame, radius 6; check = accent, fail = seal
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = -1
    outer_color = $apo_field_outer
    inner_color = $apo_field_inner
    font_color = $apo_field_font
    font_family = $apo_font_ui
    check_color = $apo_field_check
    fail_color = $apo_field_fail
    capslock_color = $apo_warning
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>印 · password</i>
    fail_text = <i>$FAIL</i> · $ATTEMPTS
    fail_timeout = 2000
    hide_input = false
    rounding = 6
    swap_font_color = false
    position = 164, -700
    halign = left
    valign = top
}

# ---- keyboard layout (us / ru / kz) under the field
label {
    monitor =
    text = $LAYOUT
    color = $apo_textMuted
    font_size = 12
    font_family = $apo_font_ui
    position = 168, -760
    halign = left
    valign = top
}

# ---- battery, bottom-left, small and muted
label {
    monitor =
    text = cmd[update:30000] printf '󰁹 %s%%' "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 || echo '–')"
    color = $apo_textMuted
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 120, 40
    halign = left
    valign = bottom
}
