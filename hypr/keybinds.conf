# Apothecary Hyprland — keybinds (sourced by on.conf, i.e. only while the theme is on).
# Full table with what each key replaced: docs/KEYBINDS.md.
#
# 1. unbind every JaKooLit bind that collides with the Apothecary set. Key names must match the
#    original bind EXACTLY as written in ~/.config/hypr/configs/Keybinds.conf (Hyprland compares the
#    key string verbatim when unbinding; "SPACE" != "Space").
# 2. bind the Apothecary set.
# 3. re-home the useful JaKooLit actions we displaced so nothing is lost.

$apo = ~/.local/bin/apothecary
$qs = qs -c apothecary ipc call
$scriptsDir = $HOME/.config/hypr/scripts

# ---- 1. unbind JaKooLit collisions ---------------------------------------------------------------
unbind = SUPER, D                 # rofi drun launcher                       -> SUPER+D now opens the cabinet launcher too
unbind = SUPER, SPACE             # togglefloating                           -> moved to SUPER+SHIFT+Space
unbind = SUPER, N                 # Hyprsunset.sh toggle (night light)       -> moved to SUPER+CTRL+N
unbind = SUPER SHIFT, N           # swaync-client -t -sw (swaync panel)      -> notification centre (swaync is stopped)
unbind = SUPER, W                 # WallpaperSelect.sh (rofi wallpaper menu) -> Apothecary wallpaper picker
unbind = SUPER SHIFT, W           # WallpaperEffects.sh                      -> apothecary wallpaper next
unbind = SUPER, T                 # ThemeChanger.sh (wallust global theme)   -> apothecary toggle (light/dark)
unbind = SUPER, G                 # togglegroup                              -> moved to SUPER+ALT+G
unbind = SUPER, I                 # layoutmsg addmaster                      -> moved to SUPER+ALT+I
unbind = SUPER SHIFT, I           # layoutmsg togglesplit (dwindle)          -> moved to SUPER+CTRL+I
unbind = SUPER, E                 # LaunchFileManager.sh (thunar)            -> superfile in kitty
unbind = SUPER, B                 # xdg-open https:// (default browser)      -> moved to SUPER+Z
unbind = SUPER SHIFT, B           # RainbowBorders-low-cpu.sh                -> not re-homed (rainbow borders are off-theme)
# JaKooLit actions that tear the theme down (restart waybar/swaync, `pkill qs`, restore JaKooLit's wallpaper):
unbind = SUPER SHIFT, G           # GameMode.sh                              -> apothecary gamemode
unbind = SUPER ALT, R             # Refresh.sh (pkill qs, restart waybar)    -> apothecary repair
unbind = CTRL ALT, W              # WallpaperRandom.sh (+wallust, Refresh)   -> apothecary wallpaper random
unbind = SUPER CTRL, B            # WaybarStyles.sh (waybar is off)          -> not re-homed while on
unbind = SUPER ALT, B             # WaybarLayout.sh (waybar is off)          -> not re-homed while on

# ---- 2. Apothecary binds -----------------------------------------------------------------------
bindd = SUPER, Space, Launcher (medicine cabinet), exec, $qs launcher toggle
bindd = SUPER, D, Launcher (medicine cabinet), exec, $qs launcher toggle
bindd = SUPER, N, Network panel, exec, $qs network toggle
bindd = SUPER, Escape, Power menu, exec, $qs power toggle
bindd = SUPER, W, Wallpaper picker, exec, $qs wallpapers toggle
bindd = SUPER SHIFT, W, Next wallpaper, exec, $apo wallpaper next
bindd = SUPER, T, Toggle light/dark mode, exec, $apo toggle
bindd = SUPER, G, Toggle desktop widgets, exec, $qs widgets toggle
bindd = SUPER, I, Notification centre, exec, $qs notifications toggle
bindd = SUPER SHIFT, N, Notification centre, exec, $qs notifications toggle
bindd = SUPER SHIFT, I, Do not disturb, exec, $qs notifications dnd
bindd = SUPER, E, Superfile (file manager), exec, kitty --class spf -e spf
bindd = SUPER, B, Brew timer start/pause, exec, $qs brew toggle
bindd = SUPER SHIFT, B, Brew timer 25 min, exec, $qs brew start 25
bindd = SUPER SHIFT, G, Game mode on/off (theme-safe), exec, $apo gamemode
bindd = SUPER ALT, R, Repair/refresh the Apothecary shell, exec, $apo repair
bindd = CTRL ALT, W, Random wallpaper, exec, $apo wallpaper random

# OSD: fire the Apothecary OSD in addition to JaKooLit's Volume.sh / Brightness.sh handlers (both run).
bindel = , XF86AudioRaiseVolume, exec, $qs osd volume
bindel = , XF86AudioLowerVolume, exec, $qs osd volume
bindl = , XF86AudioMute, exec, $qs osd volume
bindel = , XF86MonBrightnessUp, exec, $qs osd brightness
bindel = , XF86MonBrightnessDown, exec, $qs osd brightness

# ---- 3. re-homed JaKooLit actions ---------------------------------------------------------------
bindd = SUPER SHIFT, Space, Float current window, togglefloating,
bindd = SUPER CTRL, N, Toggle Hyprsunset (night light), exec, $scriptsDir/Hyprsunset.sh toggle
bindd = SUPER ALT, G, Toggle group, togglegroup
bindd = SUPER ALT, I, Add master (master layout), layoutmsg, addmaster
bindd = SUPER CTRL, I, Toggle split (dwindle), layoutmsg, togglesplit
bindd = SUPER, Z, Open default browser, exec, xdg-open "https://"
