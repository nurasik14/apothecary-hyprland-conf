# Apothecary Hyprland — hypridle. Used ONLY while the theme is on: `apothecary on` / `session-start` run
# `hypridle -c <repo>/hypr/hypridle.conf`; `apothecary off` restarts the stock `hypridle` (~/.config/hypr/hypridle.conf,
# which is never modified). Timings: 5 min dim → 10 min lock → 15 min screen off; lock before sleep.

general {
    # loginctl lock-session (JaKooLit's LockScreen.sh, CTRL+ALT+L) lands here → the Apothecary hyprlock.
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/apothecary/repo/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on       # wake the panel after resume
    ignore_dbus_inhibit = false                      # respect idle inhibitors (video players, browsers)
}

# 5 min: dim the backlight to 30 % (state saved), restore on activity.
# NOTE: this laptop exposes no /sys/class/backlight device (NVIDIA + Intel, brightnessctl sees only an LED), so on
# this machine the dim step is a no-op and never errors; it works as intended where a backlight exists.
listener {
    timeout = 300
    on-timeout = brightnessctl -c backlight -s set 30% >/dev/null 2>&1 || true
    on-resume = brightnessctl -c backlight -r >/dev/null 2>&1 || true
}

# 10 min: lock (goes through lock_cmd above)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: screen off; back on at the first input
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
