# Apothecary Hyprland — decorations (sourced by on.conf after colors.conf).
# Paper, ink and lacquer: soft rounding, a 2 px frame like a mounted scroll, generous gaps so the
# wallpaper (the art zone) breathes, soft shadows, light blur for the Quickshell layers.
# Colour values are NOT set here — colors.conf (per mode) owns col.active_border, shadow colour, etc.
# Hyprland 0.56 syntax.

general {
    border_size = 2                 # the scroll-mount frame (JaKooLit: 1)
    gaps_in = 6
    gaps_out = 12
    resize_on_border = true
}

decoration {
    rounding = 8                    # radius "md" from DESIGN.md §4
    active_opacity = 0.94           # thin paper: the wallpaper shows through a little (blurred, see below)
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.06             # a whisper of ink wash on unfocused windows
    dim_special = 0.35              # scrim behind the special workspace

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.17
        vibrancy_darkness = 0.0
        noise = 0.01
        contrast = 0.9
        brightness = 0.95
        new_optimizations = true
        xray = false                # blur what is behind, do not cut straight through to the wallpaper
        ignore_opacity = true
        special = true              # blur behind the special workspace
        popups = true               # blur behind popups (menus, tooltips)
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0 3
        scale = 0.97
        sharp = false
        # color / color_inactive come from colors.conf
    }
}

# Layer rules for the Quickshell shell (namespaces apothecary-*). Every surface gets blur with the fully
# see-through parts ignored (ignore_alpha 0.35: soft shadows and halos are NOT blurred, only the panel bodies), plus a soft entrance animation that
# matches where it is anchored: the bar drops from the top, side panels slide in from the right, the
# launcher and power menu grow in place, widgets and the OSD simply fade.
# Catch-all FIRST (later rules win): before, it sat last and switched blur back ON for the widgets layer.
layerrule = match:namespace ^(apothecary-.*)$, blur on, ignore_alpha 0.35
layerrule = match:namespace ^(apothecary-bar)$, blur on, ignore_alpha 0.35, animation slide top
layerrule = match:namespace ^(apothecary-launcher)$, blur on, ignore_alpha 0.35, animation popin 90%
layerrule = match:namespace ^(apothecary-notif)$, blur on, ignore_alpha 0.35, animation slide right
layerrule = match:namespace ^(apothecary-notifcenter)$, blur on, ignore_alpha 0.35, animation slide right
layerrule = match:namespace ^(apothecary-network)$, blur on, ignore_alpha 0.35, animation slide right
layerrule = match:namespace ^(apothecary-power)$, blur on, ignore_alpha 0.35, animation popin 90%
layerrule = match:namespace ^(apothecary-wallpapers)$, blur on, ignore_alpha 0.35, animation slide bottom
layerrule = match:namespace ^(apothecary-osd)$, blur on, ignore_alpha 0.35, animation fade
layerrule = match:namespace ^(apothecary-widgets)$, blur off, ignore_alpha 0, animation fade
