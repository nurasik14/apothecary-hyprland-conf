# Apothecary Hyprland — animations (sourced by on.conf).
# Ink spreading on wet paper: slow, soft ease-outs. Nothing springs, bounces or overshoots.
# Speeds are in 100 ms units (7 = 700 ms). Beziers are the three named curves from BRIEF.md §2 / DESIGN.md §5.

animations {
    enabled = yes

    # Curves (name, x1, y1, x2, y2) — all end flat (y2 = 1), none overshoot (no y > 1 / y < 0).
    bezier = ink, 0.22, 1, 0.36, 1        # ease-out quint: things entering (windows, panels, notes)
    bezier = brush, 0.65, 0, 0.35, 1      # ease-in-out cubic: symmetric moves, fades, toggles
    bezier = drift, 0.33, 1, 0.68, 1      # ease-out cubic: workspaces, moves, hover washes

    # Windows: appear by growing from 85 % with `ink` over 700 ms; leave the same way, a little faster.
    animation = windows, 1, 7, ink, popin 85%            # default for all window animations
    animation = windowsIn, 1, 7, ink, popin 85%          # window opens: grow from 85 % (no slide, no bounce)
    animation = windowsOut, 1, 6, brush, popin 85%       # window closes: shrink to 85 % and fade
    animation = windowsMove, 1, 6, drift                 # moving/resizing/tiling changes drift into place

    # Borders: static. No colour-change animation and no rotating gradient ("rainbow borders" off).
    animation = border, 0                                # border colour switches instantly on focus change
    animation = borderangle, 0                           # gradient angle never rotates (overrides JaKooLit's 180 s loop)

    # Fades: dim/undim, opacity, layer fade-outs — 500 ms `brush`.
    animation = fade, 1, 5, brush                        # default fade
    animation = fadeIn, 1, 5, brush                      # window fade-in
    animation = fadeOut, 1, 5, brush                     # window fade-out
    animation = fadeSwitch, 1, 5, brush                  # opacity change on focus switch
    animation = fadeShadow, 1, 5, brush                  # shadow fade
    animation = fadeDim, 1, 5, brush                     # dim_inactive fade
    animation = fadeLayers, 1, 5, brush                  # layer-surface fade (bar, widgets, OSD)

    # Workspaces: slide horizontally with `drift` over 400 ms — same curve, quicker (user: faster screen switches).
    animation = workspaces, 1, 4, drift, slide           # switch between normal workspaces
    animation = workspacesIn, 1, 4, drift, slide         # incoming workspace
    animation = workspacesOut, 1, 4, drift, slide        # outgoing workspace
    animation = specialWorkspace, 1, 5, drift, slidevert # special (scratchpad) workspace drops from the top

    # Layers (Quickshell surfaces): fade by default — per-namespace slide/popin styles are set in decorations.conf.
    animation = layers, 1, 5, ink, fade                  # default for layer surfaces
    animation = layersIn, 1, 6, ink, fade                # layer appears: 600 ms ink
    animation = layersOut, 1, 5, brush, fade             # layer hides: 500 ms brush
}
