# Apothecary Hyprland — window rules (sourced by on.conf). Hyprland 0.56 `match:` syntax.
# Later rules win over earlier ones for the same property, and this file is sourced after JaKooLit's
# WindowRules.conf, so these take precedence while the theme is on.

# superfile in kitty (SUPER+E → `kitty --class spf -e spf`): a floating 70 % sheet in the middle of the screen.
windowrule = match:class ^(spf)$, float on, center on, size 70% 70%
windowrule = match:class ^(spf)$, opacity 0.98 0.98

# Helper windows the Apothecary shell may spawn (class apothecary-*): float them, centred.
windowrule = match:class ^(apothecary-.*)$, float on, center on, size 60% 60%

# Settings-style utilities float (JaKooLit only centres some of these).
windowrule = match:class ^(nwg-look)$, float on, center on, size 60% 70%
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, float on, center on, size 50% 60%
windowrule = match:class ^(blueman-manager|\.blueman-manager-wrapped)$, float on, center on, size 50% 60%
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(kvantummanager|qt6ct|qt5ct)$, float on, center on

# Terminal paper: kitty sets its own background_opacity (0.88, apps/kitty/*.conf); the compositor only adds
# the global active/inactive opacity from decorations.conf, so the blurred wallpaper shows through a little.

# Video players and the browser's fullscreen video: no blur, fully opaque, so the picture stays crisp.
windowrule = match:class ^(mpv|vlc|com.github.rafostar.Clapper|io.github.celluloid_player.Celluloid)$, no_blur on, opacity 1.0 1.0
windowrule = match:tag multimedia, no_blur on, opacity 1.0 1.0
windowrule = match:fullscreen true, opacity 1.0 1.0, no_dim on

# Picture-in-picture windows: float, pinned, no shadow dim.
windowrule = match:title ^(Picture-in-Picture|Picture in picture)$, float on, pin on, no_dim on
