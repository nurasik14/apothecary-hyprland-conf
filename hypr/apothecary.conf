# Apothecary Hyprland — entry point (linked as ~/.config/hypr/apothecary.conf by scripts/install.sh)
# This file is ALWAYS sourced (last line of ~/.config/hypr/hyprland.conf). Keep it tiny and inert:
# everything theme-specific lives behind ~/.config/apothecary/active.conf, which the `apothecary`
# CLI points at hypr/on.conf or hypr/off.conf.

# Always-on fix (independent of the theme): the user's hermes-gateway.service (and anything else in
# the systemd --user session) starts before Hyprland, so shells it spawns never see WAYLAND_DISPLAY /
# HYPRLAND_INSTANCE_SIGNATURE. Push the compositor's environment into systemd --user once per login and
# restart the gateway so its children inherit it. See docs/INSTALL.md → "Why apothecary.conf restarts
# hermes-gateway". exec-once runs only at Hyprland start, never on `hyprctl reload`.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY && systemctl --user restart hermes-gateway.service

# The switchable theme layer: hypr/on.conf (theme on) or hypr/off.conf (theme off, empty).
source = ~/.config/apothecary/active.conf
