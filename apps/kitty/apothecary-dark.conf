# Apothecary Hyprland — kitty dark · Inner Palace 后宫 (lacquer + vermilion + gold)
# Included from ~/.config/kitty/kitty.conf through ~/.config/apothecary/kitty/current.conf (apps/apply-mode.sh flips it).
# Colours come from the design tokens; this file adds type, padding and the paper tab bar.

include ~/.config/apothecary/kitty/colors-dark.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.6
cursor_trail            0

window_padding_width    10
background_opacity      0.88
dynamic_background_opacity yes
dim_opacity             0.85

# tab bar: a paper strip with slanted lacquer tabs
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index} {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

enable_audio_bell       no
visual_bell_duration    0.0
bell_on_tab             "印 "

url_style               curly
underline_hyperlinks    hover
confirm_os_window_close 0
